alerts:
  - name: HighLatencyP95
    severity: warning
    condition: latency_p95 > 3000ms
    duration: 5m
    type: symptom-based
    channel: slack
    owner: devops-team
    runbook: docs/alerts.md#highlatencyp95
  - name: ElevatedErrorRate
    severity: critical
    condition: error_rate > 5%
    duration: 2m
    type: symptom-based
    channel: slack
    owner: devops-team
    runbook: docs/alerts.md#elevatederrorrate
  - name: LowRetrievalSuccess
    severity: warning
    condition: retrieval_success < 80%
    duration: 3m
    type: symptom-based
    channel: slack
    owner: ai-team
    runbook: docs/alerts.md#lowretrievalsuccess
